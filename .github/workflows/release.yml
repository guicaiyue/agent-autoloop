name: release

# 只有打了 v* tag 才跑：把这一版的源码打成构建物，算好 sha256，挂到 Release 上，再主动告诉中台「可以升了」。
# 部署只认这个构建物（NAS 上由 install-release.sh 下载、校验、解包、换软链），不认仓库源码，
# 所以生产机上没有 .git，也不需要从任何开发机推代码过去。
#
# 中台那边：事件 autoloop.release（来源 github）命中规则「中台：自动上线」→ nas-ops 装这一版。
# 发事件放在「挂到 Release」之后的独立 job 里，构建物确实挂上了才发；发不出去就让这个 workflow 红，
# 不要静默——没有兜底轮询，这条事件就是唯一的发版信号。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 打包并算 sha256
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          prefix="agent-autoloop-${tag#v}"
          mkdir -p out
          # --prefix 让解包后是一个目录；gzip -n 不写时间戳，同一个 tag 每次打出来字节一致
          git archive --format=tar --prefix="$prefix/" "$tag" | gzip -n -9 > "out/$prefix.tar.gz"
          ( cd out && sha256sum "$prefix.tar.gz" > "$prefix.tar.gz.sha256" )
          echo "prefix=$prefix" >> "$GITHUB_ENV"
          {
            echo "### $tag 的构建物"
            echo
            echo '```'
            cat "out/$prefix.tar.gz.sha256"
            echo '```'
            echo
            echo "commit: \`$(git rev-parse "$tag")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Agent Autoloop ${GITHUB_REF_NAME#v}" \
              --notes "构建物由 release.yml 从 tag $GITHUB_REF_NAME 生成，部署只认这个文件。"
          fi
          gh release upload "$GITHUB_REF_NAME" "out/$prefix.tar.gz" "out/$prefix.tar.gz.sha256" --clobber

  # 构建物已经在 Release 上了，这里只负责叫中台：POST /v1/events 后等这一轮跑完。
  # 口径与 story 的 deploy job 一致：state 是 done 或 nothing 就算完；cancelled 或等超时报错。
  notify:
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 发上线事件
        env:
          HUB: ${{ secrets.AUTOLOOP_HOOK_URL }}
          KEY: ${{ secrets.AUTOLOOP_SOURCE_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          UA: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36
        run: |
          set -euo pipefail
          [ -n "$HUB" ] || { echo "没有配 AUTOLOOP_HOOK_URL"; exit 1; }
          [ -n "$KEY" ] || { echo "没有配 AUTOLOOP_SOURCE_KEY"; exit 1; }
          # subject 必须是 tag：NAS 上 ops.sh 把事件的 subject 直接当版本号传给 install_release。
          # 幂等键只用 tag，不拼 run id——重跑同一次发版不该再装一遍。
          id="autoloop.release:${REPO}:${TAG}"
          detail=$(jq -cn --arg repo "$REPO" --arg tag "$TAG" --arg sha "$SHA" \
            '{repo:$repo, tag:$tag, sha:$sha}')
          payload=$(jq -cn --arg id "$id" --arg type autoloop.release --arg subject "$TAG" \
            --arg summary "中台新版本 $TAG（构建物已挂上）" --arg detail "$detail" \
            --arg link "https://github.com/${REPO}/releases/tag/${TAG}" \
            '{id:$id, type:$type, subject:$subject, summary:$summary, detail:$detail, link:$link}')
          # 雷池把 curl 的默认 UA 当机器人直接 403；带一个普通浏览器 UA 就放行。
          resp=$(curl -fsS -A "$UA" -X POST "$HUB/v1/events" \
            -H "Authorization: Bearer $KEY" -H 'content-type: application/json' -d "$payload")
          echo "$resp"
          if [ "$(echo "$resp" | jq -r .duplicate)" = "true" ]; then
            echo "这条事件之前已经记过（同样的 id），没有新的一轮，不用等。"
            exit 0
          fi
          echo "EVENT=$(echo "$resp" | jq -r .event)" >> "$GITHUB_ENV"
          echo "EVENT_ID=$id" >> "$GITHUB_ENV"

      - name: 等中台升级完
        env:
          HUB: ${{ secrets.AUTOLOOP_HOOK_URL }}
          KEY: ${{ secrets.AUTOLOOP_SOURCE_KEY }}
          WAIT: "900"
          UA: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36
        run: |
          set -uo pipefail
          # 上一步判出重复事件时不写 EVENT，这里直接结束。
          [ -n "${EVENT:-}" ] || { echo "没有新事件（重复触发），不用等。"; exit 0; }
          rounds=$(( ${WAIT:-900} / 4 ))
          for i in $(seq 1 $rounds); do
            sleep 4
            body=$(curl -fsS -A "$UA" -H "Authorization: Bearer $KEY" "$HUB/v1/events/$EVENT" || true)
            [ -n "$body" ] || continue
            state=$(echo "$body" | jq -r '(.runs[0].state) // "none"')
            echo "第 $i 次：state=$state"
            case "$state" in
              done|nothing)
                echo "$body" | jq -r '.runs[0].summary // ""'
                echo "这一轮做完了。"
                exit 0 ;;
              cancelled)
                echo "这一轮被取消了："; echo "$body" | jq -c '.runs[0]' | head -c 600; exit 1 ;;
            esac
          done
          echo "等了 $((WAIT/60)) 分钟还没结论，去中台看：$EVENT_ID" >&2
          exit 1
